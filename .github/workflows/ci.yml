name: CI

on:
  push:
    branches: [develop, main]

# Least-privilege default for all jobs. CI only lints/tests; nothing needs
# write access. Escalate per-job if that ever changes.
permissions:
  contents: read

jobs:
  ci:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check CI unit-test inventory
        run: bun scripts/check-ci-test-inventory.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  web-build:
    # Guard for the @stwd/web Worker build. deploy-web-cloudflare.yml only
    # triggers on main pushes / PRs touching web/**, so a packages/* change
    # (e.g. the @stwd/shared barrel leaking node:crypto into the client
    # bundle, issue #231) can break the web build without any check firing.
    # Build the Worker here — no upload, no secrets — so those regressions
    # surface immediately. Mirrors build-check in deploy-web-cloudflare.yml.
    name: Web Build (@stwd/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      # OpenNext tooling needs Node; pin to 22 (Node 24 breaks its CLI deps).
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # web imports the @stwd/react|sdk|shared workspace packages via their
      # dist/ outputs, so they must be built before the Next build can
      # resolve them.
      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@stwd/react --filter=@stwd/sdk --filter=@stwd/shared

      - name: Build Worker (OpenNext)
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_STEWARD_API_URL: "https://eliza.steward.fi"
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || 'ci-build-check-placeholder' }}
        run: bun run cf:build

      - name: Validate Worker bundle (dry-run deploy)
        working-directory: web
        run: bunx wrangler deploy --dry-run --outdir /tmp/wrangler-dryrun

  unit:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/sdk
          - packages/policy-engine
          - packages/vault
          - packages/auth
          - packages/proxy
          - packages/webhooks
          - packages/db
          - packages/shared
          - packages/attestation
          - packages/plugin-wxmr
          - packages/plugin-trading
          - packages/plugin-capabilities
          - packages/plugin-example
          - packages/plugin-sdk
          - packages/provider-aws
          - packages/provider-github
          - packages/provider-google
          - packages/provider-slack
          - packages/provider-x
          - packages/solana-signer
          - packages/trade-sessions
          - packages/cli
          - packages/react
          - packages/react-native
          - packages/mcp
          - packages/erc8004
          - packages/erc8183
          - packages/adapters
          - packages/proxy-client
          - packages/seed
          - packages/venue-hyperliquid
          - packages/venue-polymarket
          - scripts/__tests__
          # packages/eliza-plugin is intentionally absent: its test script is
          # `vitest run`, not `bun test` — see the unit-eliza-plugin job.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: |
          if [ "${{ matrix.package }}" = "scripts/__tests__" ]; then
            # scripts/ has no workspace package name to filter on, and its
            # tests import package *sources* directly. The one dist-resolving
            # imports currently resolved through package exports are
            # @stwd/shared and @stwd/attestation (the latter is exercised by
            # the check-attestation subprocess tests).
            bunx turbo run build --filter=@stwd/shared --filter=@stwd/attestation
          else
            PKG_NAME="@stwd/$(basename ${{ matrix.package }})"
            bunx turbo run build --filter="${PKG_NAME}..."
          fi

      - name: Test ${{ matrix.package }}
        # --isolate gives each test file a fresh global object so module
        # replacements installed via `mock.module()` in one file don't
        # leak into the next. Without this, e.g. zz-proxy-spend-limit's
        # `mock.module("@stwd/db")` stub poisoned every subsequent file
        # that imported the real `@stwd/db` schema. See issue #59.
        run: |
          if [ "${{ matrix.package }}" = "packages/sdk" ]; then
            mapfile -t sdk_tests < <(find packages/sdk/src -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) | sort)
            bun test --isolate "${sdk_tests[@]}"
          elif [ "${{ matrix.package }}" = "packages/plugin-sdk" ] || [ "${{ matrix.package }}" = "packages/plugin-example" ]; then
            # These facade suites intentionally preload a hermetic PGLite
            # context from their package-local bunfig.toml. Running them from
            # the repository root skips that preload and fails at module init.
            (cd "${{ matrix.package }}" && bun run test)
          elif [ "${{ matrix.package }}" = "packages/trade-sessions" ]; then
            # PGLite migrations can exceed Bun's 5s default on hosted runners.
            # Keep file isolation while honoring the package's 30s test budget.
            bun test --isolate --timeout 30000 packages/trade-sessions
          else
            bun test --isolate ${{ matrix.package }}
          fi
        env:
          STEWARD_MASTER_PASSWORD: "ci-test-secret"
          # Proxy fixtures deliberately run without request-signing or a shared
          # Redis connection. NODE_ENV=production still overrides this flag.
          STEWARD_PROXY_DEV_MODE: "true"
          # bunfig.toml [test] preloads only load from bun's cwd, and this job
          # runs `bun test` from the repo root — so per-package preloads (e.g.
          # plugin-trading's, which supplies this key) never run. 64-char dummy
          # matching the preload's "a".repeat(64).
          STEWARD_AUDIT_HMAC_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

  unit-eliza-plugin:
    # packages/eliza-plugin's own test script is `vitest run`, not
    # `bun test`, so it gets a dedicated job rather than a unit matrix entry.
    name: Unit Tests (packages/eliza-plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@stwd/eliza-plugin...

      - name: Test packages/eliza-plugin
        working-directory: packages/eliza-plugin
        run: bun run test

  unit-agent-trader:
    # packages/agent-trader ships real src/__tests__ coverage but no root-level
    # `scripts.test`, so run it explicitly from the package directory where its
    # workspace links resolve correctly.
    name: Unit Tests (packages/agent-trader)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@stwd/agent-trader...

      - name: Test packages/agent-trader
        working-directory: packages/agent-trader
        run: bun test src/__tests__

  unit-android:
    name: Unit Tests (packages/android)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Java SDK dependency
        run: mvn -B -f packages/java/pom.xml install -DskipTests
      - name: Test Android SDK
        run: mvn -B -f packages/android/pom.xml test

  unit-csharp:
    name: Unit Tests (packages/csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test C# SDK
        # Steward.Tests is a dependency-free executable harness, not a VSTest
        # project. `dotnet test` only built it and reported success with zero
        # tests; run the harness so assertion failures reach the job status.
        run: dotnet run --project packages/csharp/tests/Steward.Tests/Steward.Tests.csproj

  unit-go:
    name: Unit Tests (packages/go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Go SDK
        working-directory: packages/go
        run: go test ./...

  unit-java:
    name: Unit Tests (packages/java)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Java SDK
        run: mvn -B -f packages/java/pom.xml test

  unit-python:
    name: Unit Tests (packages/python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Python SDK
        run: PYTHONPATH=packages/python python3 -m unittest discover -s packages/python/tests

  unit-ruby:
    name: Unit Tests (packages/ruby)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Ruby SDK
        run: ruby -Ipackages/ruby/lib -e 'Dir["packages/ruby/test/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'

  unit-rust:
    name: Unit Tests (packages/rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Rust SDK
        run: cargo test --locked --manifest-path packages/rust/Cargo.toml

  unit-swift:
    name: Unit Tests (packages/swift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test Swift SDK
        run: swift test --package-path packages/swift

  unit-signer-frost:
    # The FROST tests build and exercise the real Rust threshold-signing
    # sidecar. GitHub's Ubuntu image includes stable Rust; a dedicated job
    # avoids both silently skipping the suite and constraining it to the Bun
    # matrix's shorter timeout.
    name: Unit Tests (packages/signer-frost)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.85.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@stwd/signer-frost...

      - name: Build FROST sidecar
        run: cargo build --locked --release --manifest-path packages/signer-frost/sidecar/Cargo.toml

      - name: Test packages/signer-frost
        working-directory: packages/signer-frost
        run: bun run test

  unit-flutter:
    # The Bun validator checks repository shape and required strings; only the
    # Dart toolchain can prove the SDK and its security contract tests compile.
    name: Unit Tests (packages/flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1c5eb12d812966ca84680edc38353a0851c8fd56 # v2.14.0
        with:
          flutter-version: "3.19.6"
          channel: stable

      - name: Install Flutter dependencies
        working-directory: packages/flutter
        run: flutter pub get

      - name: Analyze Flutter SDK
        working-directory: packages/flutter
        run: flutter analyze --fatal-infos

      - name: Test Flutter SDK
        working-directory: packages/flutter
        run: flutter test

  unit-web:
    # web/src contains Bun-driven unit suites that are distinct from the Worker
    # build and the Playwright trust-ux checks. Keep them explicit so adding a
    # source-level test cannot silently bypass CI.
    name: Unit Tests (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@stwd/react --filter=@stwd/sdk --filter=@stwd/shared

      - name: Test web/src
        working-directory: web
        run: bun test src

  unit-redis:
    name: Unit Tests (packages/redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDIS_URL: "redis://localhost:6379"
      STEWARD_REDIS_TESTS: "1"

    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test packages/redis
        run: bun test --isolate packages/redis
        env:
          STEWARD_MASTER_PASSWORD: "ci-test-secret"

  integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: "redis://localhost:6379"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward_ci
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (required for workspace imports)
        run: bunx turbo run build --filter=@stwd/api...

      - name: Run migrations
        run: bun packages/db/src/migrate.ts
        env:
          DATABASE_URL: "postgres://steward:steward_ci@localhost:5432/steward_test"

      - name: RLS pool isolation proof (real Postgres)
        run: bun test ./packages/db/src/__tests__/tenant-rls-postgres.test.ts
        env:
          DATABASE_URL: "postgres://steward:steward_ci@localhost:5432/steward_test"

      - name: Vault custody transition race proof (real Postgres)
        run: bun test ./packages/vault/src/__tests__/custody-transition-race.real-pg.test.ts
        env:
          DATABASE_URL: "postgres://steward:steward_ci@localhost:5432/steward_test"

      - name: Start API test server
        env:
          DATABASE_URL: "postgres://steward:steward_ci@localhost:5432/steward_test"
          PORT: "3299"
          SKIP_MIGRATIONS: "1"
          STEWARD_BIND_HOST: "127.0.0.1"
          STEWARD_MASTER_PASSWORD: "ci-test-secret"
          STEWARD_PLATFORM_KEY: "ci-platform-key"
          STEWARD_PLATFORM_KEYS: "ci-platform-key"
          STEWARD_PLATFORM_KEY_SCOPES: '{"ci-platform-key":["platform:*"]}'
          ALLOW_USER_TENANT_CREATION: "true"
          STEWARD_JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars-long"
          STEWARD_EMAIL_CODE_SECRET: "ci-email-code-secret-must-be-at-least-32-chars-long"
          STEWARD_EXECUTION_AUTH_SECRET: "v2-ci-1:ci-execution-auth-secret-must-be-at-least-32-bytes-long"
          STEWARD_AUDIT_HMAC_KEY: "ci-audit-hmac-key-must-be-at-least-32-bytes-long"
          # Include the exact loopback host exercised by the smoke client; SIWE
          # binding compares URL.host, including non-default ports.
          SIWE_ALLOWED_DOMAINS: "steward.fi,localhost,127.0.0.1:3200"
          # The whole api suite drives this one server from a single IP; the
          # default 100-req/60s per-IP gate 429s the sharded test flood.
          STEWARD_RATE_LIMIT_MAX_REQUESTS: "1000000"
        run: |
          bun run packages/api/src/index.ts > /tmp/steward-api-integration.log 2>&1 &
          echo $! > /tmp/steward-api-integration.pid
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3299/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/steward-api-integration.log
          exit 1

      - name: Integration tests (API)
        # ~57 of the api test files force an in-memory PGLite (a WASM Postgres) in
        # their own beforeAll even though DATABASE_URL points at real Postgres.
        # `bun test --isolate` runs every file in ONE process (it only gives each
        # file a fresh global object, not a fresh process), so those WASM heaps
        # accumulate and SIGKILL the 7GB runner (exit 137) around file ~140.
        # run-tests-isolated.ts spawns a fresh `bun test` process PER FILE, so
        # peak memory is bounded by TEST_JOBS concurrent files (not the suite
        # size) and each process frees its WASM heap on exit. Reproduced in a
        # 6GB-capped Linux container: the single `--isolate` process is killed
        # at exit 137; a 6-way --shard split still OOMs (25 files/shard is too
        # much). Keep this serial: even two PGLite processes can starve an API
        # request long enough to hit Bun's per-test timeout. The runner's
        # 120-second default leaves headroom for migration-heavy files while
        # the 25-minute job timeout still bounds the complete suite.
        run: TEST_JOBS=1 TEST_TIMEOUT=120000 bun packages/api/scripts/run-tests-isolated.ts
        env:
          DATABASE_URL: "postgres://steward:steward_ci@localhost:5432/steward_test"
          PORT: "3299"
          STEWARD_MASTER_PASSWORD: "ci-test-secret"
          STEWARD_PLATFORM_KEY: "ci-platform-key"
          STEWARD_PLATFORM_KEYS: "ci-platform-key"
          STEWARD_PLATFORM_KEY_SCOPES: '{"ci-platform-key":["platform:*"]}'
          ALLOW_USER_TENANT_CREATION: "true"
          STEWARD_JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars-long"
          STEWARD_EMAIL_CODE_SECRET: "ci-email-code-secret-must-be-at-least-32-chars-long"
          STEWARD_EXECUTION_AUTH_SECRET: "v2-ci-1:ci-execution-auth-secret-must-be-at-least-32-bytes-long"
          STEWARD_AUDIT_HMAC_KEY: "ci-audit-hmac-key-must-be-at-least-32-bytes-long"
          # Isolated files reuse deterministic agent/host fixtures, so retain
          # Redis enforcement with a high bounded ceiling for the test flood.
          STEWARD_PROXY_RATE_LIMIT_MAX: "1000000"
          STEWARD_PROXY_DEV_MODE: "true"
          SIWE_ALLOWED_DOMAINS: "steward.fi,localhost,127.0.0.1:3200"

      - name: Stop API test server
        if: always()
        run: |
          if [ -f /tmp/steward-api-integration.pid ]; then
            kill "$(cat /tmp/steward-api-integration.pid)" || true
          fi
          if [ -f /tmp/steward-api-integration.log ]; then
            cat /tmp/steward-api-integration.log
          fi

  e2e-smoke:
    name: E2E Smoke (Embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_URL: "redis://localhost:6379"

    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Redis revocation monotonicity
        run: bun test ./packages/auth/src/__tests__/redis-revocation.integration.test.ts

      - name: Start embedded API
        env:
          PORT: "3200"
          STEWARD_BIND_HOST: "127.0.0.1"
          STEWARD_PGLITE_PATH: "/tmp/steward-fi-e2e-pglite"
          STEWARD_MASTER_PASSWORD: "ci-test-secret"
          STEWARD_PLATFORM_KEY: "ci-platform-key"
          STEWARD_PLATFORM_KEYS: "ci-platform-key"
          STEWARD_PLATFORM_KEY_SCOPES: '{"ci-platform-key":["platform:*"]}'
          ALLOW_USER_TENANT_CREATION: "true"
          STEWARD_JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars-long"
          STEWARD_EMAIL_CODE_SECRET: "ci-email-code-secret-must-be-at-least-32-chars-long"
          STEWARD_EXECUTION_AUTH_SECRET: "v2-ci-1:ci-execution-auth-secret-must-be-at-least-32-bytes-long"
          STEWARD_AUDIT_HMAC_KEY: "ci-audit-hmac-key-must-be-at-least-32-bytes-long"
          SIWE_ALLOWED_DOMAINS: "steward.fi,localhost,127.0.0.1:3200"
        run: |
          bun run start:local > /tmp/steward-fi-e2e.log 2>&1 &
          echo $! > /tmp/steward-fi-e2e.pid
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3200/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/steward-fi-e2e.log
          exit 1

      - name: Run e2e smoke
        env:
          STEWARD_URL: "http://127.0.0.1:3200"
          PLATFORM_KEY: "ci-platform-key"
        run: bun run test:e2e:smoke

      - name: Stop embedded API
        if: always()
        run: |
          if [ -f /tmp/steward-fi-e2e.pid ]; then
            kill "$(cat /tmp/steward-fi-e2e.pid)" || true
          fi
          if [ -f /tmp/steward-fi-e2e.log ]; then
            cat /tmp/steward-fi-e2e.log
          fi


  e2e-integration:
    name: E2E Integration (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Monero compose profile contract
        run: scripts/test-compose-monero.sh

      - name: Start compose stack
        env:
          POSTGRES_DB: "steward_test"
          POSTGRES_USER: "steward"
          POSTGRES_PASSWORD: "steward_ci"
          STEWARD_MASTER_PASSWORD: "ci-test-secret"
          STEWARD_PLATFORM_KEY: "ci-platform-key"
          STEWARD_PLATFORM_KEYS: "ci-platform-key"
          STEWARD_PLATFORM_KEY_SCOPES: '{"ci-platform-key":["platform:*"]}'
          ALLOW_USER_TENANT_CREATION: "true"
          STEWARD_JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars-long"
          STEWARD_EMAIL_CODE_SECRET: "ci-email-code-secret-must-be-at-least-32-chars-long"
          STEWARD_EXECUTION_AUTH_SECRET: "v2-ci-1:ci-execution-auth-secret-must-be-at-least-32-bytes-long"
          STEWARD_AUDIT_HMAC_KEY: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
          # Dummy HMAC root so the required compose var interpolates; production
          # supplies a real value. Does not weaken fail-closed behavior.
          STEWARD_PROXY_REQUEST_SIGNING_SECRET: "ci-proxy-signing-secret-must-be-at-least-32-bytes"
          STEWARD_KDF_SALT: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          STEWARD_ALLOW_INSECURE_DB: "true"
          # Run the stack in non-prod mode for the functional e2e flow: the e2e
          # script doesn't sign request-expiry / authorization-signature headers,
          # which are enforced only when NODE_ENV=production (covered by unit tests).
          NODE_ENV: "test"
          STEWARD_PROXY_DEV_MODE: "true"
          STEWARD_PROXY_RATE_LIMIT_MAX: "1000000"
          STEWARD_ALLOW_STALE_SENSITIVE_REQUESTS: "true"
          SIWE_ALLOWED_DOMAINS: "steward.fi,localhost,127.0.0.1:3200"
          PORT: "3200"
          STEWARD_PROXY_PORT: "8080"
        run: |
          # API and proxy intentionally share the same image. Build it once;
          # asking Compose to build both services exports the identical image
          # twice and can exhaust a hosted runner during the duplicate export.
          docker compose build steward-api
          docker compose up -d --no-build postgres redis steward-api steward-proxy
          for url in http://127.0.0.1:3200/health http://127.0.0.1:8080/health; do
            for _ in $(seq 1 90); do
              if curl -sf "$url" >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -sf "$url" >/dev/null
          done

      - name: Run e2e integration
        env:
          STEWARD_URL: "http://127.0.0.1:3200"
          PROXY_URL: "http://127.0.0.1:8080"
          PLATFORM_KEY: "ci-platform-key"
        run: bun run test:e2e:integration

      - name: Stop compose stack
        if: always()
        env:
          STEWARD_MASTER_PASSWORD: "ci-test-secret"
          STEWARD_PLATFORM_KEYS: "ci-platform-key"
          STEWARD_JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars-long"
          STEWARD_EMAIL_CODE_SECRET: "ci-email-code-secret-must-be-at-least-32-chars-long"
          STEWARD_EXECUTION_AUTH_SECRET: "v2-ci-1:ci-execution-auth-secret-must-be-at-least-32-bytes-long"
          STEWARD_AUDIT_HMAC_KEY: "ci-audit-hmac-key-must-be-at-least-32-bytes-long"
          STEWARD_PROXY_REQUEST_SIGNING_SECRET: "ci-proxy-signing-secret-must-be-at-least-32-bytes"
          STEWARD_KDF_SALT: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          POSTGRES_DB: "steward_test"
          POSTGRES_USER: "steward"
          POSTGRES_PASSWORD: "steward_ci"
        run: |
          docker compose logs steward-api steward-proxy redis postgres || true
          docker compose down -v
