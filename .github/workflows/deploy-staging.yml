# Auto-deploy to Railway STAGING
#
# Branch strategy:
#   develop  ──(this workflow, auto)──▶  STAGING
#   main     ──(deploy-railway.yml, manual/gated)──▶  PRODUCTION
#
# This reconciles after either the full CI or Docker workflow for `develop`
# succeeds, then verifies that both exact-SHA runs completed successfully before
# pointing Railway staging at that immutable image. Staging therefore tracks accepted
# develop commits, so it can never
# silently drift behind (the failure mode that stranded staging on a stale
# pre-#129 build and broke the cloud→Steward auth-gate).
#
# Production is deliberately NOT auto-deployed — it is promoted manually from
# `main` via deploy-railway.yml (workflow_dispatch). Prod should rarely change.
name: Deploy Staging

on:
  # Either completion retriggers reconciliation. This avoids missing a deploy
  # when one workflow finishes (or is successfully rerun) after the other.
  workflow_run:
    workflows: ["CI", "Docker"]
    types: [completed]
    branches: [develop]

  # Allow manual staging redeploys (e.g. to re-point at a specific tag).
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy to staging (default: develop)"
        required: false
        type: string
        default: "develop"

permissions:
  actions: read
  contents: read
  deployments: write

# Railway deploys mutate one shared staging service. Serialize manual and
# automatic requests so two close develop pushes cannot race each other.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    # On workflow_run, start only for a successful upstream completion whose SHA
    # is still live. The verifier independently requires successful exact-SHA
    # CI and Docker runs, regardless of which workflow triggered this run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        if: github.event_name == 'workflow_run'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Verify exact CI candidate and Docker image
        id: verify
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_BRANCH: develop
        run: bun scripts/verify-staging-deploy-readiness.ts

      - name: Resolve image tag
        id: resolve
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.verify.outputs.deploy == 'true'
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Automatic runs deploy the immutable tag built by the exact upstream
          # Docker run. Manual dispatches retain the operator-selected tag.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            TAG="sha-${UPSTREAM_SHA}"
          else
            TAG="${DISPATCH_TAG:-develop}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Staging image tag: ${TAG}"

      - name: Create GitHub deployment (staging)
        id: deployment
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.verify.outputs.deploy == 'true'
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a # v2
        with:
          token: ${{ github.token }}
          environment: staging
          ref: ${{ github.sha }}
          description: "Deploy ghcr.io/steward-fi/steward:${{ steps.resolve.outputs.tag }} to Railway staging"

      - name: Deploy to Railway staging
        id: deploy
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.verify.outputs.deploy == 'true'
        # Instance-specific targets come from the DEPLOYER's repo config, never
        # hardcoded in this sovereign OSS repo. A self-hoster sets their own
        # STAGING_RAILWAY_* repo variables (or this job no-ops via the guard in
        # railway-deploy.sh). Eliza cloud (one self-hoster) sets its own values.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.STAGING_RAILWAY_SERVICE_ID }}
          RAILWAY_ENV_ID: ${{ vars.STAGING_RAILWAY_ENV_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.STAGING_RAILWAY_HEALTH_URL }}
          RESOLVED_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          chmod +x scripts/railway-deploy.sh
          ./scripts/railway-deploy.sh "$RESOLVED_TAG"

      - name: Update deployment status (success)
        if: >-
          (github.event_name == 'workflow_dispatch' ||
          steps.verify.outputs.deploy == 'true') && success()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: ${{ vars.STAGING_RAILWAY_HEALTH_URL }}

      - name: Update deployment status (failure)
        if: >-
          (github.event_name == 'workflow_dispatch' ||
          steps.verify.outputs.deploy == 'true') && failure()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
