# Auto-deploy to Railway STAGING
#
# Branch strategy:
#   develop  ──(this workflow, auto)──▶  STAGING
#   main     ──(deploy-railway.yml, manual/gated)──▶  PRODUCTION
#
# This reconciles after either the full CI or Docker workflow for `develop`
# succeeds, verifies that both exact-SHA runs completed successfully, releases
# that source's database schema, and only then points Railway staging at the
# immutable image. Staging therefore tracks accepted develop commits, so it can never
# silently drift behind (the failure mode that stranded staging on a stale
# pre-#129 build and broke the cloud→Steward auth-gate).
#
# Production is deliberately NOT auto-deployed — it is promoted manually from
# `main` via deploy-railway.yml (workflow_dispatch). Prod should rarely change.
name: Deploy Staging

on:
  # Either completion retriggers reconciliation. This avoids missing a deploy
  # when one workflow finishes (or is successfully rerun) after the other.
  workflow_run:
    workflows: ["CI", "Docker"]
    types: [completed]
    branches: [develop]

  # Manual runs use the selected ref's exact SHA and still require successful
  # exact-SHA CI + Docker runs. There is no mutable-tag or migration bypass.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write

# Railway deploys mutate one shared staging service. Serialize manual and
# automatic requests so two close develop pushes cannot race each other.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    # Staging is intentionally fully automatic: repository/organization Actions
    # secrets provide release-only authority without a reviewer or wait gate.
    # Production keeps its separate protected deployment boundary.
    # The verifier independently requires successful exact-SHA CI and Docker
    # runs and rejects a candidate that is no longer the live develop tip.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Verify exact CI candidate and Docker image
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TARGET_BRANCH: develop
        run: bun scripts/verify-staging-deploy-readiness.ts

      - name: Resolve image tag
        id: resolve
        if: steps.verify.outputs.deploy == 'true'
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "Staging release source: ${TARGET_SHA}"

      - name: Install release dependencies
        if: steps.verify.outputs.deploy == 'true'
        run: |
          bun install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      # Create the durable attempt record before mutating the database so a
      # failed migration/bootstrap is visible as a failed deployment.
      - name: Create GitHub deployment (staging)
        id: deployment
        if: steps.verify.outputs.deploy == 'true'
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a # v2
        with:
          token: ${{ github.token }}
          environment: staging
          ref: ${{ steps.resolve.outputs.sha }}
          description: "Deploy ghcr.io/steward-fi/steward:${{ steps.resolve.outputs.tag }} to Railway staging"

      - name: Release staging database
        if: steps.verify.outputs.deploy == 'true'
        env:
          STEWARD_RELEASE_SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          STEWARD_RELEASE_IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
          STEWARD_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          STEWARD_OPERATOR_DATABASE_URL: ${{ secrets.STAGING_OPERATOR_DATABASE_URL }}
          STEWARD_APP_DATABASE_URL: ${{ secrets.STAGING_APP_DATABASE_URL }}
          STEWARD_APP_DATABASE_ROLE: ${{ vars.STAGING_APP_DATABASE_ROLE }}
          STEWARD_MIGRATION_DATABASE_ROLE: ${{ vars.STAGING_MIGRATION_DATABASE_ROLE }}
          STEWARD_OPERATOR_DATABASE_ROLE: ${{ vars.STAGING_OPERATOR_DATABASE_ROLE }}
          STEWARD_BOOTSTRAP_DATABASE_ROLE: ${{ vars.STAGING_BOOTSTRAP_DATABASE_ROLE }}
          STEWARD_PLATFORM_DATABASE_ROLE: ${{ vars.STAGING_PLATFORM_DATABASE_ROLE }}
          STEWARD_PLUGINS: ${{ vars.STAGING_STEWARD_PLUGINS }}
        run: ./scripts/staging-database-release.sh

      - name: Deploy to Railway staging
        id: deploy
        if: steps.verify.outputs.deploy == 'true'
        # Instance-specific targets come from the DEPLOYER's repo config, never
        # hardcoded in this sovereign OSS repo. A self-hoster sets their own
        # STAGING_RAILWAY_* repo variables (or this job no-ops via the guard in
        # railway-deploy.sh). Eliza cloud (one self-hoster) sets its own values.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.STAGING_RAILWAY_SERVICE_ID }}
          RAILWAY_ENV_ID: ${{ vars.STAGING_RAILWAY_ENV_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.STAGING_RAILWAY_HEALTH_URL }}
          RAILWAY_DIRECT_HEALTH_URL: ${{ vars.STAGING_RAILWAY_DIRECT_HEALTH_URL }}
          RAILWAY_REQUIRE_DIRECT_HEALTH: "true"
          RESOLVED_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          chmod +x scripts/railway-deploy.sh
          ./scripts/railway-deploy.sh "$RESOLVED_TAG"

      - name: Update deployment status (success)
        if: steps.verify.outputs.deploy == 'true' && success()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: ${{ vars.STAGING_RAILWAY_HEALTH_URL }}

      - name: Update deployment status (failure)
        if: steps.verify.outputs.deploy == 'true' && failure()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e # v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
