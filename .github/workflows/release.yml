# Publish npm packages and create a GitHub Release when a version tag is pushed
# Requires NPM_TOKEN secret with publish access to @stwd org
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents:write is required to create GitHub Releases
    # packages:write for GHCR (docker workflow handles this separately, but good to have)
    permissions:
      contents: write
      packages: write

    steps:
      # Checkout the full repo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install Bun for building the monorepo
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      # Setup Node for npm publish (Bun doesn't handle npm auth well)
      # registry-url is required for NODE_AUTH_TOKEN to work
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@stwd"

      # Install all monorepo dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build all packages via Turborepo (respects dependency order)
      - name: Build all packages
        run: bunx turbo run build

      # Publish each public package to npm. Skips when the local version is
      # already on the registry (idempotent: a release tag may bump only some
      # packages while leaving others on their already-published version).
      # Network errors / auth failures still fail the release.
      - name: Publish @stwd/sdk
        run: bash scripts/publish-if-new.sh packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @stwd/react
        run: bash scripts/publish-if-new.sh packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @stwd/eliza-plugin
        run: bash scripts/publish-if-new.sh packages/eliza-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create a GitHub Release with auto-generated changelog from commits
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
