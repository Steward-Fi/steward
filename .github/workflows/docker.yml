# Build and push Docker image to GitHub Container Registry (GHCR)
# Triggers on pushes to develop + main branches and version tags (v*)
#   develop -> :develop image (auto-deployed to STAGING by deploy-staging.yml)
#   main    -> :main image (promoted to PRODUCTION manually via deploy-railway.yml)
#   v*      -> :<semver> image (tagged release for production)
name: Docker

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "packages/**/package.json"
      - ".github/workflows/docker.yml"

# A branch tag is mutable. Do not let a slower build for an older push finish
# after a newer build and overwrite `:develop` / `:main` with stale bytes.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      image_tags: ${{ steps.meta.outputs.tags }}
    # packages:write is required to push to GHCR
    # contents:read is required to checkout the repo
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Authenticate with GHCR when publishing images from push events.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enable BuildKit for layer caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Generate image tags and labels from git metadata
      # - branch pushes get the branch name as tag (e.g. develop)
      # - version tags get semver tags (e.g. 0.4.0, 0.4)
      # - version tags also get "latest"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/steward-fi/steward
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Immutable tag consumed by the staging workflow.
            type=sha,format=long

      # Build pull requests to validate the Dockerfile; publish images for pushes
      # to develop and version tags so deploys can pull the expected tags.
      - name: Build and optionally push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Write cache entries only from trusted push builds. PR builds still
          # read the cache (cache-from) but cannot populate mode=max entries,
          # closing the residual cross-branch cache-pollution risk class.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          # Attach verifiable build metadata and an SPDX software bill of
          # materials to published images. Both remain local on PR dry-runs.
          provenance: mode=max
          sbom: true
          build-args: |
            CACHE_BUST=${{ github.sha }}

      # Output the primary image tag for downstream workflows (deploy-railway)
      # For version tags: use semver (e.g. 0.5.0)
      # For branch pushes: use branch name (e.g. develop)
      - name: Export image tag
        id: image-tag
        run: |
          # Use the $GITHUB_REF env var rather than inlining ${{ github.ref }}
          # into the script (avoids GHA expression-injection into the shell).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${GITHUB_REF#refs/heads/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Primary image tag: ${TAG}"
