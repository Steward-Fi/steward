# Steward enterprise reference profile.
#
# Usage (steward init is the ONLY supported way to produce the env file; it
# generates distinct admin, migration, and runtime database credentials plus
# all application secrets. Do NOT
# copy .env.example as-is — its secret values are intentionally empty and
# compose's `${VAR:?required}` guards will refuse to start):
#   steward init --env deploy/enterprise-reference/.env --force
#   docker compose --env-file deploy/enterprise-reference/.env \
#     -f deploy/enterprise-reference/docker-compose.yml \
#     --profile enterprise-reference up -d

services:
  steward-core-migrate:
    profiles: ["enterprise-reference"]
    build:
      context: ../..
      dockerfile: Dockerfile
    image: steward:${STEWARD_IMAGE_TAG:-enterprise-reference}
    command: ["bun", "packages/api/scripts/migrate-production.ts", "core"]
    environment:
      MIGRATION_DATABASE_URL: "${STEWARD_ADMIN_DATABASE_URL:?STEWARD_ADMIN_DATABASE_URL required}"
      # Explicit acknowledgement is required because this allows plaintext DB
      # transport. The bundled Postgres is isolated on the internal steward-data
      # network, but an operator-supplied external DATABASE_URL must never
      # inherit this silently.
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      STEWARD_ALLOW_UNVERIFIED_DB_TLS: "${STEWARD_ALLOW_UNVERIFIED_DB_TLS:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # Dual-homed: reaches the bundled postgres via steward-data, and an
      # operator-supplied external DATABASE_URL via steward-backend egress.
      steward-backend:
        # Compose does not define a default gateway for equal priorities. Pin
        # the egress-capable network explicitly (Compose >= 2.33.1).
        gw_priority: 1
      steward-data: {}
    restart: "no"

  steward-rls-bootstrap:
    profiles: ["enterprise-reference"]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["psql"]
    command:
      - "--no-psqlrc"
      - "-v"
      - "steward_app_role=steward_app"
      - "-v"
      - "steward_migration_role=steward_migrator"
      - "-v"
      - "steward_bootstrap_role=steward_bootstrap_owner"
      - "-f"
      - "/scripts/postgres/rls-compose-bootstrap.sql"
    environment:
      PGDATABASE: "${STEWARD_ADMIN_DATABASE_URL:?STEWARD_ADMIN_DATABASE_URL required}"
      STEWARD_DB_APP_PASSWORD: "${STEWARD_DB_APP_PASSWORD:-}"
      STEWARD_DB_MIGRATION_PASSWORD: "${STEWARD_DB_MIGRATION_PASSWORD:-}"
      STEWARD_DB_PLATFORM_PASSWORD: "${STEWARD_DB_PLATFORM_PASSWORD:-}"
      STEWARD_BOOTSTRAP_SET_ROLE_PASSWORDS: "${STEWARD_BOOTSTRAP_SET_ROLE_PASSWORDS:-false}"
    volumes:
      - ../../scripts/postgres:/scripts/postgres:ro
    depends_on:
      steward-core-migrate:
        condition: service_completed_successfully
    networks:
      steward-backend:
        gw_priority: 1
      steward-data: {}
    restart: "no"

  steward-plugin-migrate:
    profiles: ["enterprise-reference"]
    image: steward:${STEWARD_IMAGE_TAG:-enterprise-reference}
    command: ["bun", "packages/api/scripts/migrate-production.ts", "plugins"]
    environment:
      MIGRATION_DATABASE_URL: "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL required}"
      STEWARD_PLUGINS: "${STEWARD_PLUGINS:-}"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      STEWARD_ALLOW_UNVERIFIED_DB_TLS: "${STEWARD_ALLOW_UNVERIFIED_DB_TLS:-}"
    depends_on:
      steward-rls-bootstrap:
        condition: service_completed_successfully
    networks:
      steward-backend:
        gw_priority: 1
      steward-data: {}
    restart: "no"

  steward-rls-activate:
    profiles: ["enterprise-reference"]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["psql"]
    command:
      - "--no-psqlrc"
      - "-v"
      - "steward_app_role=steward_app"
      - "-v"
      - "steward_migration_role=steward_migrator"
      - "-f"
      - "/scripts/postgres/rls-activate.sql"
    environment:
      PGDATABASE: "${STEWARD_ADMIN_DATABASE_URL:?STEWARD_ADMIN_DATABASE_URL required}"
    volumes:
      - ../../scripts/postgres:/scripts/postgres:ro
    depends_on:
      steward-plugin-migrate:
        condition: service_completed_successfully
    networks:
      steward-backend:
        gw_priority: 1
      steward-data: {}
    restart: "no"

  steward-api:
    profiles: ["enterprise-reference"]
    build:
      context: ../..
      dockerfile: Dockerfile
    image: steward:${STEWARD_IMAGE_TAG:-enterprise-reference}
    environment:
      PORT: "3200"
      STEWARD_BIND_HOST: "0.0.0.0"
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL required}"
      STEWARD_APP_DATABASE_ROLE: "${STEWARD_APP_DATABASE_ROLE:-steward_app}"
      STEWARD_PLATFORM_DATABASE_URL: "${STEWARD_PLATFORM_DATABASE_URL:?STEWARD_PLATFORM_DATABASE_URL required}"
      STEWARD_PLATFORM_DATABASE_ROLE: "${STEWARD_PLATFORM_DATABASE_ROLE:-steward_platform}"
      REDIS_URL: "redis://redis:6379"
      STEWARD_MASTER_PASSWORD: "${STEWARD_MASTER_PASSWORD:?required}"
      STEWARD_JWT_SECRET: "${STEWARD_JWT_SECRET:?required}"
      STEWARD_EXECUTION_AUTH_SECRET: "${STEWARD_EXECUTION_AUTH_SECRET:?required}"
      STEWARD_KDF_SALT: "${STEWARD_KDF_SALT:?required}"
      # Custody posture: no STEWARD_KMS_PROVIDER is set, so the vault runs in
      # `local` mode (plaintext key in app memory at sign time). With
      # NODE_ENV=production the vault refuses to boot local mode unless the
      # posture is acknowledged. The value comes from .env (this profile requires
      # an .env; the template ships STEWARD_ACK_LOCAL_CUSTODY=true as the
      # reference stack's deliberate, auditable local-custody posture). No
      # `:-true` default is injected here so an env that omits it fails closed
      # rather than silently acking. To harden, set STEWARD_KMS_PROVIDER=aws|pkcs11
      # (+ config) and clear the ack. See docs/security/custody-posture.md.
      STEWARD_ACK_LOCAL_CUSTODY: "${STEWARD_ACK_LOCAL_CUSTODY:-}"
      STEWARD_AUDIT_HMAC_KEY: "${STEWARD_AUDIT_HMAC_KEY:?required}"
      STEWARD_AUDIT_SIGNING_KEY: "${STEWARD_AUDIT_SIGNING_KEY:?required}"
      STEWARD_PLATFORM_KEYS: "${STEWARD_PLATFORM_KEYS:-}"
      STEWARD_PLATFORM_KEY: "${STEWARD_PLATFORM_KEY:-}"
      STEWARD_PLATFORM_KEY_SCOPES: "${STEWARD_PLATFORM_KEY_SCOPES:-}"
      STEWARD_PROXY_REQUEST_SIGNING_SECRETS: "${STEWARD_PROXY_REQUEST_SIGNING_SECRETS:-}"
      RPC_URL: "${RPC_URL:-https://mainnet.base.org}"
      CHAIN_ID: "${CHAIN_ID:-8453}"
      APP_URL: "${APP_URL:-https://steward.localhost}"
      PASSKEY_RP_NAME: "${PASSKEY_RP_NAME:-Steward}"
      PASSKEY_RP_ID: "${PASSKEY_RP_ID:-steward.localhost}"
      PASSKEY_ORIGIN: "${PASSKEY_ORIGIN:-https://steward.localhost}"
      X_CLIENT_ID: "${X_CLIENT_ID:-}"
      X_CLIENT_SECRET: "${X_CLIENT_SECRET:-}"
      SKIP_MIGRATIONS: "true"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      STEWARD_ALLOW_UNVERIFIED_DB_TLS: "${STEWARD_ALLOW_UNVERIFIED_DB_TLS:-}"
    depends_on:
      steward-rls-activate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3200/ready');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8
    networks:
      steward-backend:
        gw_priority: 1
      steward-data: {}

  steward-proxy:
    profiles: ["enterprise-reference"]
    image: steward:${STEWARD_IMAGE_TAG:-enterprise-reference}
    command: ["bun", "run", "packages/proxy/src/index.ts"]
    environment:
      STEWARD_PROXY_PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL required}"
      STEWARD_APP_DATABASE_ROLE: "${STEWARD_APP_DATABASE_ROLE:-steward_app}"
      REDIS_URL: "redis://redis:6379"
      # Fail CLOSED on spend-limit / rate-limit enforcement if Redis is
      # unreachable. Without this the proxy fails OPEN (enforcement silently
      # bypassed) when redis dies — unacceptable for the reference profile.
      REDIS_REQUIRED: "true"
      STEWARD_MASTER_PASSWORD: "${STEWARD_MASTER_PASSWORD:?required}"
      STEWARD_JWT_SECRET: "${STEWARD_JWT_SECRET:?required}"
      STEWARD_EXECUTION_AUTH_SECRET: "${STEWARD_EXECUTION_AUTH_SECRET:?required}"
      STEWARD_KDF_SALT: "${STEWARD_KDF_SALT:?required}"
      # Proxy-side approval expiry extends the tamper-evident audit chain
      # (release.ts -> withTenantAuditedTransaction); required or expired-approval
      # polls fail closed in production.
      STEWARD_AUDIT_HMAC_KEY: "${STEWARD_AUDIT_HMAC_KEY:?required}"
      STEWARD_PROXY_REQUEST_SIGNING_SECRETS: "${STEWARD_PROXY_REQUEST_SIGNING_SECRETS:?required}"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      STEWARD_ALLOW_UNVERIFIED_DB_TLS: "${STEWARD_ALLOW_UNVERIFIED_DB_TLS:-}"
    depends_on:
      steward-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      steward-backend:
        gw_priority: 1
      steward-data: {}

  caddy:
    profiles: ["enterprise-reference"]
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      - "${STEWARD_TLS_HTTP_PORT:-80}:80"
      - "${STEWARD_TLS_HTTPS_PORT:-443}:443"
    environment:
      STEWARD_DOMAIN: "${STEWARD_DOMAIN:-steward.localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      steward-api:
        condition: service_healthy
      steward-proxy:
        condition: service_healthy
    networks:
      - steward-backend

  postgres:
    profiles: ["enterprise-reference"]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward -d steward"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - steward-data

  redis:
    profiles: ["enterprise-reference"]
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - steward-data

  backup:
    profiles: ["enterprise-reference", "backup"]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["/bin/sh", "-ec"]
    # SEC-081:
    #  - The DSN is sourced from the mounted env FILE, not container env, so
    #    the DB password no longer appears in `docker inspect`.
    #  - SEC-050: pg_dump's argv is visible in the HOST process list
    #    (/proc/<pid>/cmdline), so the password must not ride inside the DSN
    #    either. The command below strips both userinfo and libpq query-string
    #    passwords from the DSN and authenticates via PGPASSWORD (same pattern
    #    as scripts/migrate.sh).
    #  - umask 077: dumps contain tenant PII, audit events, and encrypted key
    #    blobs in PLAINTEXT — they are written mode 0600. Keep ./backups
    #    mode 0700 on the host (or on encrypted storage), restrict it to the
    #    operator account, and encrypt/prune dumps per your retention policy.
    command:
      - |
        # Never source the dotenv file as shell code. `steward init` accepts an
        # operator-supplied MIGRATION_DATABASE_URL, and URI bytes such as '&' and '$()'
        # must remain inert data rather than becoming shell syntax. Read only
        # the two keys this one-shot backup needs, without eval/`.`.
        read_steward_env_value() {
          steward_env_key="$$1"
          steward_env_value="$$(sed -n "s/^$${steward_env_key}=//p" /run/steward/env | sed -n '1p')"
          case "$$steward_env_value" in
            \'*\') steward_env_value="$${steward_env_value#\'}"; steward_env_value="$${steward_env_value%\'}" ;;
            \"*\") steward_env_value="$${steward_env_value#\"}"; steward_env_value="$${steward_env_value%\"}" ;;
            \'*|\"*) echo "Malformed quoted $$steward_env_key in Steward env file" >&2; return 1 ;;
          esac
          printf '%s' "$$steward_env_value"
        }
        MIGRATION_DATABASE_URL="$$(read_steward_env_value MIGRATION_DATABASE_URL)"
        STEWARD_DB_MIGRATION_PASSWORD="$$(read_steward_env_value STEWARD_DB_MIGRATION_PASSWORD)"
        export MIGRATION_DATABASE_URL STEWARD_DB_MIGRATION_PASSWORD
        umask 077
        # Never inherit a separately supplied password into pg_dump. The only
        # credential allowed below is one decoded from MIGRATION_DATABASE_URL itself.
        unset PGPASSWORD
        dsn="$${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL required}"
        # libpq accepts a raw '?' inside userinfo even though RFC 3986 normally
        # requires it to be percent-encoded. A fragment, however, is never a
        # supported connection target and makes delimiter parsing ambiguous.
        # Reject it before any password-bearing value can reach pg_dump argv.
        case "$$dsn" in
          *\#*) echo 'MIGRATION_DATABASE_URL fragments are not supported' >&2; exit 1 ;;
        esac
        # POSIX-portable percent-decoder (octal printf works in dash/BusyBox ash;
        # printf '%b' with \xHH does not). Defined before first use.
        pg_url_decode() {
          pg_encoded="$$1"
          if printf '%s' "$$pg_encoded" | grep -q '[[:cntrl:]]'; then
            return 1
          fi
          # A malformed escape can make our redacted URI differ from libpq's
          # interpretation. Refuse it instead of passing an ambiguous DSN to
          # pg_dump.
          case "$$(printf '%s' "$$pg_encoded" | sed 's/%[0-9A-Fa-f][0-9A-Fa-f]//g')" in
            *%*) return 1 ;;
          esac
          pg_decoded=
          while [ -n "$$pg_encoded" ]; do
            pg_char="$${pg_encoded%"$${pg_encoded#?}"}"
            pg_encoded="$${pg_encoded#?}"
            if [ "$$pg_char" = '%' ]; then
              pg_hex="$${pg_encoded%"$${pg_encoded#??}"}"
              pg_encoded="$${pg_encoded#??}"
              case "$$pg_hex" in
                00|0a|0A|0d|0D) return 1 ;; # NUL/CR/LF cannot be env data
                [0-9A-Fa-f][0-9A-Fa-f]) ;;
                *) return 1 ;;
              esac
              pg_oct="$$(printf '%03o' "$$((0x$$pg_hex))")"
              pg_char="$$(printf "\\$$pg_oct")"
            fi
            pg_decoded="$$pg_decoded$$pg_char"
          done
          printf '%s' "$$pg_decoded"
        }
        # Strip user:password@ and ?password= from the DSN; pass the password
        # via PGPASSWORD so it never appears on pg_dump's argv (SEC-050). A
        # passwordless DSN is passed through unchanged. Query keywords are
        # case-insensitive in libpq and may percent-encode their names, so
        # decode keys before matching and fail closed on malformed escapes.
        case "$$dsn" in
          postgres://*|postgresql://*)
            pg_scheme="$${dsn%%://*}"
            pg_rest="$${dsn#*://}"
            # Isolate the authority before looking for userinfo. When a path is
            # present, '/' is the unambiguous authority terminator; importantly,
            # libpq accepts a raw '?' in userinfo, so treating '?' as the first
            # terminator can leave the password-bearing DSN on pg_dump argv.
            # Without a path, '?' followed by '@' is intrinsically ambiguous
            # (raw userinfo vs. a query value), so reject it fail-closed.
            case "$$pg_rest" in
              */*) pg_authority="$${pg_rest%%/*}" ;;
              *\?*@*) echo 'MIGRATION_DATABASE_URL contains ambiguous user information' >&2; exit 1 ;;
              *) pg_authority="$$(printf '%s' "$$pg_rest" | sed 's|[?].*||')" ;;
            esac
            pg_suffix="$${pg_rest#"$$pg_authority"}"
            # A raw '/' inside userinfo terminates the authority before '@',
            # while multiple raw '@' delimiters have no safe, unique split.
            # Reject both ambiguous forms instead of letting their secret bytes
            # survive in the redacted DSN passed on pg_dump's argv.
            case "$${pg_suffix%%\?*}" in
              *@*) echo 'MIGRATION_DATABASE_URL contains ambiguous user information' >&2; exit 1 ;;
            esac
            case "$$pg_authority" in
              *@*@*) echo 'MIGRATION_DATABASE_URL contains ambiguous user information' >&2; exit 1 ;;
            esac
            case "$$pg_authority" in
              *:*@*)
                pg_userinfo="$${pg_authority%%@*}"
                pg_host="$${pg_authority#*@}"
                pg_user="$${pg_userinfo%%:*}"
                pg_pw="$${pg_userinfo#*:}"
                dsn="$${pg_scheme}://$${pg_user}@$${pg_host}$${pg_suffix}"
                # Percent-decode the password component (PGPASSWORD is literal).
                # Reject malformed escapes and NUL, which cannot be represented
                # in an environment and must never be silently truncated. Decode
                # via pg_url_decode: octal printf is POSIX-portable (dash,
                # BusyBox ash), whereas printf '%b' with \xHH is not.
                case "$$(printf '%s' "$$pg_pw" | sed 's/%[0-9A-Fa-f][0-9A-Fa-f]//g')" in
                  *%*) echo 'Invalid percent escape in MIGRATION_DATABASE_URL password' >&2; exit 1 ;;
                esac
                case "$$pg_pw" in *%00*) echo 'NUL is not allowed in MIGRATION_DATABASE_URL password' >&2; exit 1 ;; esac
                if ! pg_pw="$$(pg_url_decode "$$pg_pw")"; then
                  echo 'Invalid percent escape in MIGRATION_DATABASE_URL password' >&2; exit 1
                fi
                PGPASSWORD="$$pg_pw"
                export PGPASSWORD
                ;;
            esac
            ;;
          *)
            # Steward MIGRATION_DATABASE_URL accepts only libpq URI form. In particular,
            # never pass a keyword/value conninfo string through unchanged: it
            # can carry password=... directly on pg_dump's argv.
            echo 'MIGRATION_DATABASE_URL must use postgres:// or postgresql://' >&2
            exit 1
            ;;
        esac
        pg_query_password=
        pg_query_password_found=
        # Query parameters are part of the DSN passed to pg_dump, so remove
        # every password keyword before the invocation. Retain all unrelated
        # query bytes byte-for-byte (including user= and ordering).
        case "$$dsn" in
          *\?*)
            pg_query_base="$${dsn%%\?*}"
            pg_query="$${dsn#*\?}"
            pg_retained_query=
            pg_retained_query_started=
            pg_query_done=
            pg_query_candidate=
            while :; do
              case "$$pg_query" in
                *\&*)
                  pg_part="$${pg_query%%\&*}"
                  pg_query="$${pg_query#*\&}"
                  ;;
                *)
                  pg_part="$$pg_query"
                  pg_query=
                  pg_query_done=1
                  ;;
              esac
              case "$$pg_part" in
                *=*)
                  pg_raw_key="$${pg_part%%=*}"
                  pg_raw_value="$${pg_part#*=}"
                  ;;
                *)
                  pg_raw_key="$$pg_part"
                  pg_raw_value=
                  ;;
              esac
              if ! pg_query_key="$$(pg_url_decode "$$pg_raw_key")"; then
                echo 'Invalid percent escape in MIGRATION_DATABASE_URL query' >&2
                exit 1
              fi
              # Validate values even when they are not passwords; otherwise a
              # malformed escape could be interpreted differently by libpq.
              if ! pg_url_decode "$$pg_raw_value" >/dev/null; then
                echo 'Invalid percent escape in MIGRATION_DATABASE_URL query' >&2
                exit 1
              fi
              case "$$pg_query_key" in
                [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd])
                  if [ -n "$$pg_raw_value" ]; then
                    if ! pg_query_candidate="$$(pg_url_decode "$$pg_raw_value")"; then
                      echo 'Invalid percent escape in MIGRATION_DATABASE_URL password' >&2
                      exit 1
                    fi
                    if [ -n "$$pg_query_candidate" ]; then
                      pg_query_password="$$pg_query_candidate"
                      pg_query_password_found=1
                    fi
                  fi
                  ;;
                *)
                  if [ -n "$$pg_retained_query_started" ]; then
                    pg_retained_query="$$pg_retained_query&$$pg_part"
                  else
                    pg_retained_query="$$pg_part"
                    pg_retained_query_started=1
                  fi
                  ;;
              esac
              [ -n "$$pg_query_done" ] && break
            done
            dsn="$$pg_query_base"
            if [ -n "$$pg_retained_query_started" ]; then
              dsn="$$dsn?$$pg_retained_query"
            fi
            if [ -n "$$pg_query_password_found" ]; then
              PGPASSWORD="$$pg_query_password"
              export PGPASSWORD
            fi
            ;;
        esac
        # The env file was sourced with `set -a`; remove original
        # password-bearing variables before execing pg_dump so its process
        # environment does not undo the argv hardening above.
        unset MIGRATION_DATABASE_URL STEWARD_DB_MIGRATION_PASSWORD pg_pw pg_rest pg_userinfo pg_authority \
          pg_query pg_query_candidate pg_query_password pg_raw_value pg_encoded \
          pg_decoded pg_char pg_hex pg_oct pg_query_key pg_raw_key pg_part \
          pg_query_base pg_retained_query pg_retained_query_started pg_query_done
        pg_dump "$$dsn" > "/backups/steward-$$(date -u +%Y%m%dT%H%M%SZ).sql"
    volumes:
      - ./backups:/backups
      - ./.env:/run/steward/env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # Dual-homed like steward-core-migrate: bundled postgres via steward-data,
      # external MIGRATION_DATABASE_URL (if overridden) via steward-backend egress.
      steward-backend:
        gw_priority: 1
      steward-data: {}
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  # Egress-capable: steward-api (chain RPCs), steward-proxy (LLM upstreams),
  # and caddy (ACME) need outbound access, so this bridge is not internal.
  steward-backend:
    driver: bridge
  # Data plane (SEC-161): postgres/redis publish no ports and need no egress,
  # so they sit on an internal-only network (mirrors the root compose's
  # `backend` network). steward-api/steward-proxy are dual-homed to reach it.
  steward-data:
    driver: bridge
    internal: true
