[package]
name = "steward-frost-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Steward D2 threshold-signing sidecar: FROST-secp256k1 (Zcash Foundation) share service + trusted-dealer keygen. PROTOTYPE / dev keys only."

[[bin]]
name = "frost-signer"
path = "src/main.rs"

[dependencies]
# ZF FROST-secp256k1. Pinned to 3.0.0 (verified on crates.io 2026-07-30).
# NCC partially audited the 0.6.0 line of the frost-core + ciphersuite family;
# 3.0.0 is a later release of the SAME ZF crate family. RE-VERIFY the audit
# scope + RUSTSEC advisories for this exact version before any production use.
# See THRESHOLD-SIGNING.md "Version pinning & re-verify" and D1 §2.2.
frost-secp256k1 = "=3.0.0"
frost-ed25519 = "=3.0.0"   # Solana follow-on ciphersuite (same ZF family).
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# Tiny std-only HTTP server; no async runtime, keeps the sidecar auditable.
tiny_http = "0.12"

[profile.release]
opt-level = 2
