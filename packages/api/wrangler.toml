name = "steward-api"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "REPLACE_ME"
workers_dev = true
minify = true

[triggers]
# Cloudflare's minimum cron cadence is one minute. This recovers pre-existing
# leases and provider OAuth lifecycle journals.
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
SKIP_MIGRATIONS = "1"
DATABASE_DRIVER = "neon-http"
REDIS_DRIVER = "upstash"
# Non-secret config goes here. Anything sensitive must be set via
# `wrangler secret put` instead so it doesn't end up in this file.
# JWT_ISSUER = "steward"  (default in code)
# EMAIL_AUTH_REDIRECT_BASE_URL = "https://www.elizacloud.ai"

# Required secrets — set via `wrangler secret put <NAME>`. DO NOT COMMIT VALUES.
#
# Database / Redis
#   DATABASE_URL                     Neon HTTP connection string (postgres://...)
#   KV_REST_API_URL                  Upstash REST endpoint (https://*.upstash.io)
#   KV_REST_API_TOKEN                Upstash REST token
#
# Auth / vault
#   STEWARD_JWT_SECRET               Canonical HS256 JWT signing secret
#   STEWARD_MASTER_PASSWORD          Vault keystore master
#   STEWARD_KDF_SALT                 Per-deployment hex salt for the KeyStore KDF
#   STEWARD_AUDIT_HMAC_KEY            Tamper-evident audit-chain HMAC root
#   STEWARD_IDENTITY_JWT_PRIVATE_KEY  optional PKCS#8 RS256/ES256 identity key
#                                      (configure its alg/kid/issuer/audience in vars)
#
# Email
#   RESEND_API_KEY                   Magic-link email provider
#   EMAIL_FROM                       optional: from address (default login@steward.fi)
#   APP_URL                          canonical HTTPS public base (required unless
#                                    STEWARD_IDENTITY_JWT_ISSUER is configured)
#   STEWARD_IDENTITY_JWT_ISSUER      optional dedicated canonical HTTPS identity base
#
# OAuth providers
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
#   TWITTER_CLIENT_ID, TWITTER_CLIENT_SECRET
#   X_CLIENT_ID, X_CLIENT_SECRET     provider-account X connect and lifecycle
#                                     recovery; distinct from Twitter sign-in
#
# Passkeys (WebAuthn)
#   PASSKEY_RP_ID, PASSKEY_ORIGIN, PASSKEY_RP_NAME
#   PASSKEY_ALLOWED_ORIGINS          comma-separated list of accepted origins
#
# Client IP trust (auth rate limiting) — non-secret, can live in [vars]
#   STEWARD_TRUSTED_PROXY_HOPS       trusted proxies APPENDING to x-forwarded-for
#                                    (right-most-Nth entry = client IP; unset =
#                                    coarse per-host rate-limit fallback)
#   STEWARD_TRUST_CLOUDFLARE         "true" only when origin ingress is locked to
#                                    Cloudflare; then cf-connecting-ip is trusted
#                                    (natural fit for this Workers adapter)
#   STEWARD_AUTH_RATE_LIMIT_OUTAGE_VALVE_MAX
#                                    bounded auth admissions/min/isolate while a
#                                    configured Redis is unreachable (default 300,
#                                    0 = strict fail-closed)

[env.staging]
name = "steward-api-staging"

[env.staging.vars]
NODE_ENV = "production"
SKIP_MIGRATIONS = "1"
DATABASE_DRIVER = "neon-http"
REDIS_DRIVER = "upstash"

[env.production]
name = "steward-api-prod"

[env.production.vars]
NODE_ENV = "production"
SKIP_MIGRATIONS = "1"
DATABASE_DRIVER = "neon-http"
REDIS_DRIVER = "upstash"
