# ──────────────────────────────────────────────────────────────────────────────
# Steward — Production Docker Compose
#
# Services:
#   steward-api        — REST API + vault (port 3200)
#   steward-proxy      — Credential injection proxy (port 8080)
#   postgres           — PostgreSQL 16 (internal only)
#   redis              — Redis 7 for rate limiting + token store (internal only)
#   monero-wallet-rpc  — optional wallet2 sidecar for Monero support
#                        (profile "monero"; internal only, explicit TLS daemon)
#
# Usage:
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#   docker compose logs -f steward-api
#
# Override for dev:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Steward API ──────────────────────────────────────────────────────────────
  steward-api:
    build:
      context: .
      dockerfile: Dockerfile
    # Pinned, overridable tag for reproducible deploys. Override with
    # STEWARD_IMAGE_TAG to deploy a specific build; defaults to the current release.
    image: steward:${STEWARD_IMAGE_TAG:-0.4.2}
    container_name: steward-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "${PORT:-3200}"
      STEWARD_BIND_HOST: "0.0.0.0"
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-steward}}"
      STEWARD_MASTER_PASSWORD: "${STEWARD_MASTER_PASSWORD:?STEWARD_MASTER_PASSWORD is required}"
      STEWARD_JWT_SECRET: "${STEWARD_JWT_SECRET:?STEWARD_JWT_SECRET is required}"
      STEWARD_EMAIL_CODE_SECRET: "${STEWARD_EMAIL_CODE_SECRET:?STEWARD_EMAIL_CODE_SECRET is required}"
      # PR4 execution authorization v2 key (keyId:secret,... rotation list).
      # SEPARATE from STEWARD_JWT_SECRET; governed provider actions fail closed
      # if unset. Both api (mint) and proxy (claim/verify) require it.
      STEWARD_EXECUTION_AUTH_SECRET: "${STEWARD_EXECUTION_AUTH_SECRET:?STEWARD_EXECUTION_AUTH_SECRET is required - generate with: printf 'v1:%s' \"$(openssl rand -hex 32)\"}"
      STEWARD_PLATFORM_KEYS: "${STEWARD_PLATFORM_KEYS:-}"
      STEWARD_PLATFORM_KEY_SCOPES: "${STEWARD_PLATFORM_KEY_SCOPES:-}"
      ALLOW_USER_TENANT_CREATION: "${ALLOW_USER_TENANT_CREATION:-}"
      STEWARD_ALLOW_STALE_SENSITIVE_REQUESTS: "${STEWARD_ALLOW_STALE_SENSITIVE_REQUESTS:-}"
      STEWARD_DEFAULT_TENANT_KEY: "${STEWARD_DEFAULT_TENANT_KEY:-}"
      AGENT_TOKEN_EXPIRY: "${AGENT_TOKEN_EXPIRY:-24h}"
      RPC_URL: "${RPC_URL:-https://mainnet.base.org}"
      CHAIN_ID: "${CHAIN_ID:-8453}"
      STEWARD_PLUGINS: "${STEWARD_PLUGINS:-}"
      WXMR_SOLANA_RPC_URL: "${WXMR_SOLANA_RPC_URL:-}"
      REDIS_URL: "redis://redis:6379"
      # Cleartext redis:// on the private compose network requires an explicit
      # opt-out in production (mirrors STEWARD_ALLOW_INSECURE_DB above). No
      # default is injected here: set STEWARD_ALLOW_INSECURE_REDIS=true in .env
      # for this stack, or point REDIS_URL at a rediss:// endpoint.
      STEWARD_ALLOW_INSECURE_REDIS: "${STEWARD_ALLOW_INSECURE_REDIS:-}"
      # API-side invoke paths sign requests to steward-proxy with this shared
      # root. Keep it distinct from JWT/audit secrets; the proxy service below
      # verifies the same value.
      STEWARD_PROXY_URL: "${STEWARD_PROXY_URL:-http://steward-proxy:8080}"
      STEWARD_PROXY_REQUEST_SIGNING_SECRET: "${STEWARD_PROXY_REQUEST_SIGNING_SECRET:?STEWARD_PROXY_REQUEST_SIGNING_SECRET is required - generate with: openssl rand -hex 32}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-login@localhost}"
      APP_URL: "${APP_URL:-http://localhost:3200}"
      PASSKEY_RP_NAME: "${PASSKEY_RP_NAME:-Steward}"
      PASSKEY_RP_ID: "${PASSKEY_RP_ID:-localhost}"
      PASSKEY_ORIGIN: "${PASSKEY_ORIGIN:-http://localhost:3200}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      STEWARD_KDF_SALT: "${STEWARD_KDF_SALT:?STEWARD_KDF_SALT is required - generate with: openssl rand -hex 32}"
      # Custody posture: this stack sets no STEWARD_KMS_PROVIDER, so the vault
      # runs in `local` mode (AES-256-GCM at rest; plaintext key in app memory at
      # sign time). With NODE_ENV=production the vault REFUSES TO BOOT in local
      # mode unless the operator explicitly acknowledges the posture. No default
      # is injected here on purpose: an unacknowledged production run must fail
      # closed, forcing a deliberate decision (set STEWARD_ACK_LOCAL_CUSTODY=true
      # in .env to accept local custody, or set STEWARD_KMS_PROVIDER=aws|pkcs11
      # to harden). See docs/security/custody-posture.md and .env.example.
      STEWARD_ACK_LOCAL_CUSTODY: "${STEWARD_ACK_LOCAL_CUSTODY:-}"
      STEWARD_AUDIT_HMAC_KEY: "${STEWARD_AUDIT_HMAC_KEY:?STEWARD_AUDIT_HMAC_KEY is required - generate with: openssl rand -hex 32}"
      SIWE_ALLOWED_DOMAINS: "${SIWE_ALLOWED_DOMAINS:-}"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      STEWARD_ALLOW_UNVERIFIED_DB_TLS: "${STEWARD_ALLOW_UNVERIFIED_DB_TLS:-}"
      # ── Monero (optional; empty = Monero endpoints fail closed with 503) ──
      # Enable the monero-wallet-rpc sidecar with: COMPOSE_PROFILES=monero
      # and set STEWARD_MONERO_WALLET_RPC_URL to the sidecar's endpoint below.
      STEWARD_MONERO_WALLET_RPC_URL: "${STEWARD_MONERO_WALLET_RPC_URL:-}"
      # Only consulted when the RPC URL above is set; username matches the
      # sidecar's --rpc-login.
      STEWARD_MONERO_WALLET_RPC_LOGIN: "steward:${MONERO_WALLET_RPC_PASSWORD:-}"
      # No public plaintext daemon default. Remote daemon URLs are opt-in and
      # must use TLS (validated by the vault configuration).
      STEWARD_MONERO_DAEMON_URL: "${STEWARD_MONERO_DAEMON_URL:-}"
      STEWARD_MONERO_NETWORK: "${STEWARD_MONERO_NETWORK:-mainnet}"
      STEWARD_MAX_MONERO_FEE_PICONERO: "${STEWARD_MAX_MONERO_FEE_PICONERO:-}"
    ports:
      - "127.0.0.1:${PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3200/ready');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    networks:
      - public
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Steward Proxy ────────────────────────────────────────────────────────────
  steward-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    # Same pinned image as steward-api (built from the same Dockerfile).
    image: steward:${STEWARD_IMAGE_TAG:-0.4.2}
    container_name: steward-proxy
    restart: unless-stopped
    # The API's deep /ready check verifies proxy clock health, so waiting for API
    # health here would deadlock both services. The proxy health endpoint does
    # not require the API and can start as soon as the API container is running.
    depends_on:
      steward-api:
        condition: service_started
    command: ["bun", "run", "packages/proxy/src/index.ts"]
    environment:
      STEWARD_PROXY_PORT: "${STEWARD_PROXY_PORT:-8080}"
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-steward}}"
      STEWARD_MASTER_PASSWORD: "${STEWARD_MASTER_PASSWORD:?STEWARD_MASTER_PASSWORD is required}"
      STEWARD_JWT_SECRET: "${STEWARD_JWT_SECRET:?STEWARD_JWT_SECRET is required}"
      STEWARD_EMAIL_CODE_SECRET: "${STEWARD_EMAIL_CODE_SECRET:?STEWARD_EMAIL_CODE_SECRET is required}"
      # PR4 execution authorization v2 key (keyId:secret,... rotation list).
      # SEPARATE from STEWARD_JWT_SECRET; governed provider actions fail closed
      # if unset. Both api (mint) and proxy (claim/verify) require it.
      STEWARD_EXECUTION_AUTH_SECRET: "${STEWARD_EXECUTION_AUTH_SECRET:?STEWARD_EXECUTION_AUTH_SECRET is required - generate with: printf 'v1:%s' \"$(openssl rand -hex 32)\"}"
      STEWARD_KDF_SALT: "${STEWARD_KDF_SALT:?STEWARD_KDF_SALT is required - generate with: openssl rand -hex 32}"
      # Proxy-side approval expiry now extends the tamper-evident audit chain
      # (release.ts -> withTenantAuditedTransaction), so the audit HMAC key is
      # required here just like on the api service, or expired-approval polls
      # fail closed with a 5xx in production.
      STEWARD_AUDIT_HMAC_KEY: "${STEWARD_AUDIT_HMAC_KEY:?STEWARD_AUDIT_HMAC_KEY is required - generate with: openssl rand -hex 32}"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      STEWARD_ALLOW_UNVERIFIED_DB_TLS: "${STEWARD_ALLOW_UNVERIFIED_DB_TLS:-}"
      STEWARD_PROXY_REQUEST_SIGNING_SECRET: "${STEWARD_PROXY_REQUEST_SIGNING_SECRET:?STEWARD_PROXY_REQUEST_SIGNING_SECRET is required - generate with: openssl rand -hex 32}"
      # Explicit soft posture for functional dev/test stacks. Empty by default;
      # NODE_ENV=production always overrides it in proxy security guards.
      STEWARD_PROXY_DEV_MODE: "${STEWARD_PROXY_DEV_MODE:-}"
      STEWARD_PROXY_RATE_LIMIT_MAX: "${STEWARD_PROXY_RATE_LIMIT_MAX:-60}"
      STEWARD_PROXY_RATE_LIMIT_WINDOW_MS: "${STEWARD_PROXY_RATE_LIMIT_WINDOW_MS:-60000}"
      REDIS_URL: "redis://redis:6379"
      # Cleartext redis:// on the private compose network requires an explicit
      # opt-out in production (mirrors STEWARD_ALLOW_INSECURE_DB). Set
      # STEWARD_ALLOW_INSECURE_REDIS=true in .env for this stack, or use rediss://.
      STEWARD_ALLOW_INSECURE_REDIS: "${STEWARD_ALLOW_INSECURE_REDIS:-}"
    ports:
      - "127.0.0.1:${STEWARD_PROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - public
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Monero wallet-rpc sidecar (optional, profile: monero) ────────────────────
  # Official wallet2 (monero-wallet-rpc) maintained as a container image by
  # sethforprivacy, pointed at the explicitly configured daemon — no bundled
  # monerod or blockchain storage. Wallet files under /home/monero/wallets are a
  # DISPOSABLE scan cache: the canonical (encrypted) keys live in Postgres and
  # the vault rehydrates wallets via generate_from_keys at any time.
  #
  # Custody: private keys only ever transit the internal backend network
  # between steward-api and this sidecar; the configured daemon sees block
  # requests and fully-signed transactions, never key material.
  #
  # Enable with:
  #   COMPOSE_PROFILES=monero docker compose up -d
  #   plus MONERO_WALLET_RPC_PASSWORD and
  #   STEWARD_MONERO_WALLET_RPC_URL=http://monero-wallet-rpc:18083/json_rpc in .env
  monero-wallet-rpc:
    # Pinned to the Monero release this integration was validated against.
    image: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.0@sha256:7ed1d6c565313de6a8afc33f75f7b1ca31aebd15f59558428d2bbc6b6de16950
    container_name: steward-monero-wallet-rpc
    profiles: ["monero"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        secret_file=/run/secrets/monero_wallet_rpc_password
        if [ ! -r "$$secret_file" ]; then
          echo "MONERO_WALLET_RPC_PASSWORD must be set and non-empty when the monero profile is enabled" >&2
          exit 1
        fi
        password=$$(cat "$$secret_file")
        if [ -z "$$password" ]; then
          echo "MONERO_WALLET_RPC_PASSWORD must be set and non-empty when the monero profile is enabled" >&2
          exit 1
        fi
        daemon_address="${MONERO_DAEMON_ADDRESS:-}"
        if [ -z "$$daemon_address" ]; then
          echo "MONERO_DAEMON_ADDRESS is required when the monero profile is enabled" >&2
          exit 1
        fi
        exec /entrypoint.sh \
          "--daemon-address=$$daemon_address" \
          "--daemon-ssl=enabled" \
          "--untrusted-daemon" \
          "--wallet-dir=/home/monero/wallet" \
          "--rpc-bind-ip=0.0.0.0" \
          "--rpc-bind-port=18083" \
          "--confirm-external-bind" \
          "--rpc-login=steward:$$password" \
          "--log-level=0"
    volumes:
      - monero-wallet-cache:/home/monero/wallet
    secrets:
      - source: monero-wallet-rpc-password
        target: monero_wallet_rpc_password
    # Dual-homed like steward-api: `backend` is internal-only (so only
    # steward-api can reach the RPC port), `public` provides egress to the
    # remote daemon. No host port is published.
    networks:
      - public
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: steward-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-steward}"
      POSTGRES_USER: "${POSTGRES_USER:-steward}"
      # Required: no insecure default. Set POSTGRES_PASSWORD in .env.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steward} -d ${POSTGRES_DB:-steward}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis 7 ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: steward-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  # Disposable Monero wallet scan cache (canonical keys live in Postgres).
  monero-wallet-cache:
    driver: local

# ── Secrets ───────────────────────────────────────────────────────────────────
secrets:
  monero-wallet-rpc-password:
    environment: MONERO_WALLET_RPC_PASSWORD

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # External-facing: steward-api and steward-proxy are reachable from outside
  public:
    driver: bridge

  # Internal-only: postgres and redis are not accessible from the host directly
  backend:
    driver: bridge
    internal: true
