# ──────────────────────────────────────────────────────────────────────────────
# Steward — Production Docker Compose
#
# Services:
#   steward-api        — REST API + vault (port 3200)
#   steward-proxy      — Credential injection proxy (port 8080)
#   postgres           — PostgreSQL 16 (internal only)
#   redis              — Redis 7 for rate limiting + token store (internal only)
#   monero-wallet-rpc  — optional wallet2 sidecar for Monero support
#                        (profile "monero"; internal only, remote public daemon)
#
# Usage:
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#   docker compose logs -f steward-api
#
# Override for dev:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Steward API ──────────────────────────────────────────────────────────────
  steward-api:
    build:
      context: .
      dockerfile: Dockerfile
    # Pinned, overridable tag for reproducible deploys. Override with
    # STEWARD_IMAGE_TAG to deploy a specific build; defaults to the current release.
    image: steward:${STEWARD_IMAGE_TAG:-0.4.2}
    container_name: steward-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "${PORT:-3200}"
      STEWARD_BIND_HOST: "0.0.0.0"
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-steward}}"
      STEWARD_MASTER_PASSWORD: "${STEWARD_MASTER_PASSWORD:?STEWARD_MASTER_PASSWORD is required}"
      STEWARD_JWT_SECRET: "${STEWARD_JWT_SECRET:?STEWARD_JWT_SECRET is required}"
      STEWARD_PLATFORM_KEYS: "${STEWARD_PLATFORM_KEYS:-}"
      STEWARD_PLATFORM_KEY_SCOPES: "${STEWARD_PLATFORM_KEY_SCOPES:-}"
      ALLOW_USER_TENANT_CREATION: "${ALLOW_USER_TENANT_CREATION:-}"
      STEWARD_ALLOW_STALE_SENSITIVE_REQUESTS: "${STEWARD_ALLOW_STALE_SENSITIVE_REQUESTS:-}"
      STEWARD_DEFAULT_TENANT_KEY: "${STEWARD_DEFAULT_TENANT_KEY:-}"
      AGENT_TOKEN_EXPIRY: "${AGENT_TOKEN_EXPIRY:-24h}"
      RPC_URL: "${RPC_URL:-https://mainnet.base.org}"
      CHAIN_ID: "${CHAIN_ID:-8453}"
      REDIS_URL: "redis://redis:6379"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-login@steward.fi}"
      APP_URL: "${APP_URL:-https://steward.fi}"
      PASSKEY_RP_NAME: "${PASSKEY_RP_NAME:-Steward}"
      PASSKEY_RP_ID: "${PASSKEY_RP_ID:-steward.fi}"
      PASSKEY_ORIGIN: "${PASSKEY_ORIGIN:-https://steward.fi}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      STEWARD_KDF_SALT: "${STEWARD_KDF_SALT:?STEWARD_KDF_SALT is required - generate with: openssl rand -hex 32}"
      STEWARD_AUDIT_HMAC_KEY: "${STEWARD_AUDIT_HMAC_KEY:?STEWARD_AUDIT_HMAC_KEY is required - generate with: openssl rand -hex 32}"
      SIWE_ALLOWED_DOMAINS: "${SIWE_ALLOWED_DOMAINS:-}"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      # ── Monero (optional; empty = Monero endpoints fail closed with 503) ──
      # Enable the monero-wallet-rpc sidecar with: COMPOSE_PROFILES=monero
      # and set STEWARD_MONERO_WALLET_RPC_URL to the sidecar's endpoint below.
      STEWARD_MONERO_WALLET_RPC_URL: "${STEWARD_MONERO_WALLET_RPC_URL:-}"
      STEWARD_MONERO_WALLET_RPC_LOGIN: "${MONERO_WALLET_RPC_PASSWORD:+steward:${MONERO_WALLET_RPC_PASSWORD}}"
      STEWARD_MONERO_DAEMON_URL: "${STEWARD_MONERO_DAEMON_URL:-http://node.sethforprivacy.com:18089}"
      STEWARD_MONERO_NETWORK: "${STEWARD_MONERO_NETWORK:-mainnet}"
      STEWARD_MAX_MONERO_FEE_PICONERO: "${STEWARD_MAX_MONERO_FEE_PICONERO:-}"
    ports:
      - "127.0.0.1:${PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3200/ready');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    networks:
      - public
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Steward Proxy ────────────────────────────────────────────────────────────
  steward-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    # Same pinned image as steward-api (built from the same Dockerfile).
    image: steward:${STEWARD_IMAGE_TAG:-0.4.2}
    container_name: steward-proxy
    restart: unless-stopped
    # Proxy only needs the API to be healthy (for JWT verification + DB access)
    depends_on:
      steward-api:
        condition: service_healthy
    command: ["bun", "run", "packages/proxy/src/index.ts"]
    environment:
      STEWARD_PROXY_PORT: "${STEWARD_PROXY_PORT:-8080}"
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-steward}}"
      STEWARD_MASTER_PASSWORD: "${STEWARD_MASTER_PASSWORD:?STEWARD_MASTER_PASSWORD is required}"
      STEWARD_JWT_SECRET: "${STEWARD_JWT_SECRET:?STEWARD_JWT_SECRET is required}"
      STEWARD_KDF_SALT: "${STEWARD_KDF_SALT:?STEWARD_KDF_SALT is required - generate with: openssl rand -hex 32}"
      STEWARD_ALLOW_INSECURE_DB: "${STEWARD_ALLOW_INSECURE_DB:-}"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "127.0.0.1:${STEWARD_PROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - public
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Monero wallet-rpc sidecar (optional, profile: monero) ────────────────────
  # Official wallet2 (monero-wallet-rpc) maintained as a container image by
  # sethforprivacy, pointed at a remote public daemon — no local monerod, no
  # blockchain storage. Wallet files under /home/monero/wallets are a
  # DISPOSABLE scan cache: the canonical (encrypted) keys live in Postgres and
  # the vault rehydrates wallets via generate_from_keys at any time.
  #
  # Custody: private keys only ever transit the internal backend network
  # between steward-api and this sidecar; the remote daemon sees block
  # requests and fully-signed transactions, never key material.
  #
  # Enable with:
  #   COMPOSE_PROFILES=monero docker compose up -d
  #   plus MONERO_WALLET_RPC_PASSWORD and
  #   STEWARD_MONERO_WALLET_RPC_URL=http://monero-wallet-rpc:18083/json_rpc in .env
  monero-wallet-rpc:
    # Pinned to the Monero release this integration was validated against.
    image: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.0
    container_name: steward-monero-wallet-rpc
    profiles: ["monero"]
    restart: unless-stopped
    command:
      - "--daemon-address=${MONERO_DAEMON_ADDRESS:-node.sethforprivacy.com:18089}"
      - "--untrusted-daemon"
      - "--wallet-dir=/home/monero/wallets"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18083"
      - "--confirm-external-bind"
      - "--rpc-login=steward:${MONERO_WALLET_RPC_PASSWORD:?MONERO_WALLET_RPC_PASSWORD must be set when the monero profile is enabled}"
      - "--log-level=0"
    volumes:
      - monero-wallet-cache:/home/monero/wallets
    # Dual-homed like steward-api: `backend` is internal-only (so only
    # steward-api can reach the RPC port), `public` provides egress to the
    # remote daemon. No host port is published.
    networks:
      - public
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: steward-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-steward}"
      POSTGRES_USER: "${POSTGRES_USER:-steward}"
      # Required: no insecure default. Set POSTGRES_PASSWORD in .env.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steward} -d ${POSTGRES_DB:-steward}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis 7 ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: steward-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  # Disposable Monero wallet scan cache (canonical keys live in Postgres).
  monero-wallet-cache:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # External-facing: steward-api and steward-proxy are reachable from outside
  public:
    driver: bridge

  # Internal-only: postgres and redis are not accessible from the host directly
  backend:
    driver: bridge
    internal: true
